<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A7A">
<title>KBC Inspections</title>
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root{
    --paper:#f4f5f7;
    --card:#ffffff;
    --ink:#14181c;
    --ink-soft:#5a636c;
    --line:#d7dbe0;
    --navy:#1b3a7a;
    --blue:#0b8fd6;
    --good:#1a8a3c;
    --avg:#d99400;
    --poor:#bd2a1d;
    --na:#7b848d;
    --tap:52px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;font-size:17px;}
  .hidden{display:none !important;}

  /* ---------- shell ---------- */
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 120px;}
  .topbar{
    position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .topbar-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1;}
  .topbar .sub{font-size:12.5px;opacity:.82;font-weight:500;margin-top:1px;}
  .iconbtn{
    color:#fff;font-size:14px;font-weight:600;padding:8px 10px;border-radius:8px;
    background:rgba(255,255,255,.14);
  }

  /* ---------- progress ---------- */
  .prog{height:5px;background:rgba(0,0,0,.14);}
  .prog span{display:block;height:100%;background:var(--blue);transition:width .25s ease;}

  /* ---------- cards & type ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;}
  h2{font-size:21px;margin:22px 0 6px;letter-spacing:-.3px;}
  h3{font-size:15px;margin:0 0 10px;color:var(--ink-soft);font-weight:600;}
  p.note{color:var(--ink-soft);font-size:14.5px;margin:6px 0;}

  /* ---------- forms ---------- */
  label.f{display:block;margin:14px 0 0;}
  label.f span{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  label.f input, label.f select{
    width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--ink);
  }
  label.f input:focus, label.f select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}

  .btn{
    display:block;width:100%;text-align:center;padding:16px;border-radius:11px;
    font-weight:700;font-size:17px;margin-top:14px;min-height:var(--tap);
  }
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.blue{background:var(--blue);color:#fff;}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn:disabled{opacity:.45;}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}

  /* ---------- section header ---------- */
  .sect{
    background:var(--navy);color:#fff;padding:11px 14px;border-radius:10px;
    font-weight:700;font-size:16px;margin:18px 0 0;display:flex;justify-content:space-between;gap:10px;
  }
  .sect .cnt{font-weight:600;opacity:.8;font-size:13.5px;white-space:nowrap;}

  /* ---------- inspection rows ---------- */
  .rows{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;}
  .row{border-top:1px solid var(--line);padding:11px 12px;}
  .row:first-child{border-top:none;}
  .row.done{background:#fbfcfd;}
  .row-main{display:flex;align-items:center;gap:10px;}
  .row-label{flex:1;font-size:16px;line-height:1.25;font-weight:500;}
  .marks{display:flex;gap:6px;flex-shrink:0;}
  .mark{
    width:42px;height:44px;border-radius:9px;border:2px solid var(--line);
    background:#fff;font-weight:800;font-size:15px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .mark[data-v="good"].on{background:var(--good);border-color:var(--good);color:#fff;}
  .mark[data-v="average"].on{background:var(--avg);border-color:var(--avg);color:#fff;}
  .mark[data-v="poor"].on{background:var(--poor);border-color:var(--poor);color:#fff;}
  .mark[data-v="na"]{width:36px;font-size:12.5px;}
  .mark[data-v="na"].on{background:var(--na);border-color:var(--na);color:#fff;}
  .mark:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}

  .detail{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);}
  .detail .lbl{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
  .chip{
    padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;
    font-size:14px;font-weight:600;min-height:40px;
  }
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  .chip.out{flex:1;justify-content:center;text-align:center;padding:13px 10px;min-height:48px;}
  .chip.on.ok{background:var(--good);border-color:var(--good);}
  .chip.on.bad{background:var(--poor);border-color:var(--poor);}
  .row.prow{padding:13px 12px;}
  .row.prow .chips{display:flex;gap:8px;}
  .badge{
    display:inline-block;font-size:11.5px;font-weight:800;padding:3px 8px;
    border-radius:999px;margin-top:6px;letter-spacing:.02em;
  }
  .badge.pre{background:#fdf0d5;color:#8a6100;}
  .badge.post{background:#dcecfa;color:#0f5c96;}
  .badge.done{background:#e4ece4;color:#3d6b45;}

  .photobar{margin:12px 0;}
  .photobtn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:14px;border-radius:10px;background:var(--poor);color:#fff;
    font-size:15.5px;font-weight:800;letter-spacing:.01em;min-height:50px;cursor:pointer;
    border:none;
  }
  .photobtn:active{filter:brightness(.92);}
  .photobar.has .photobtn{
    background:#e9f6ed;color:#146b30;border:1.5px solid #bfe3cb;
    justify-content:space-between;padding:12px 14px;font-size:14.5px;
  }
  .photobar.has .plabel::before{content:'\2713  ';}
  .addmore{font-size:13px;font-weight:700;opacity:.75;}
  .photobar:not(.has) .addmore{display:none;}

  .agreement{max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .agsec{margin:14px 0;}
  .agh{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:3px;}
  .agreement p{font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin:0;}
  .ack{font-size:15px;font-weight:600;line-height:1.4;margin:0 0 4px;}

  .sigwrap{position:relative;margin-top:14px;}
  .sigpad{
    width:100%;height:190px;border:2px solid var(--line);border-radius:11px;
    background:#fff;display:block;touch-action:none;
  }
  .sighint{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;color:#a8b0b8;font-size:15px;pointer-events:none;
  }
  .detail input.note{
    width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin-top:2px;
  }

  /* ---------- sticky footer ---------- */
  .footbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(244,245,247,.97);
    border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);
  }
  .footbar-inner{max-width:640px;margin:0 auto;display:flex;gap:10px;}
  .footbar .btn{margin-top:0;flex:1;}

  /* ---------- job list ---------- */
  .joblist{margin-top:6px;}
  .job{
    display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:11px;padding:14px;margin-bottom:10px;
  }
  .job .jn{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:.02em;}
  .job .jv{font-size:17px;font-weight:600;margin-top:2px;}
  .job .jc{font-size:14px;color:var(--ink-soft);margin-top:1px;}

  /* ---------- summary tiles ---------- */
  .tiles{display:flex;gap:10px;margin:16px 0;}
  .tile{flex:1;border-radius:11px;padding:14px 10px;text-align:center;color:#fff;}
  .tile b{display:block;font-size:30px;font-weight:800;line-height:1;}
  .tile span{font-size:12.5px;font-weight:600;opacity:.92;}
  .tile.g{background:var(--good);} .tile.a{background:var(--avg);} .tile.p{background:var(--poor);}

  .flagline{
    display:flex;gap:9px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;
  }
  .flagline .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;position:relative;top:1px;}
  .flagline .dot.average{background:var(--avg);} .flagline .dot.poor{background:var(--poor);}
  .flagline .cd{font-size:12.5px;font-weight:700;color:var(--ink-soft);}

  .banner{padding:12px 14px;border-radius:10px;font-size:14.5px;margin:12px 0;}
  .banner.err{background:#fdeceb;color:#8f2015;border:1px solid #f3c3bd;}
  .banner.ok{background:#e9f6ed;color:#146b30;border:1px solid #bfe3cb;}
  .banner.warn{background:#fdf4e3;color:#7a5600;border:1px solid #eed9ab;}
  .nopic{font-size:11.5px;font-weight:800;color:var(--poor);}
  .meta2{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px;margin:0;}
  .meta2 dt{color:var(--ink-soft);font-weight:600;}
  .meta2 dd{margin:0;font-weight:650;}
  .flagnum{color:var(--poor);}
  .haspic{font-size:11.5px;font-weight:800;color:var(--good);}
  .flagline.mini{align-items:center;}
  .photobar.mini{margin:0;}
  .photobar.mini .photobtn{
    padding:9px 12px;min-height:38px;font-size:12.5px;font-weight:800;
    white-space:nowrap;width:auto;
  }
  .photobar.mini.has .photobtn{padding:8px 11px;}
  .photobar.mini .addmore{display:none;}

  .loading{text-align:center;padding:48px 0;color:var(--ink-soft);}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>

/* ------------------------------------------------------------
   Photo handling — phone photos are 3–5MB each. Compress before
   upload or the free storage tier disappears in a few months.
   ------------------------------------------------------------ */
function compressImage(file, maxPx=1400, quality=0.7){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width:w, height:h } = img;
      if(Math.max(w,h) > maxPx){
        const s = maxPx / Math.max(w,h);
        w = Math.round(w*s); h = Math.round(h*s);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Could not process image')),
               'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src = url;
  });
}

function jobDate(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date();
  const days = Math.floor((now - d) / 86400000);
  const t = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if(days === 0 && d.getDate() === now.getDate()) return `Today ${t}`;
  if(days <= 1) return `Yesterday ${t}`;
  if(days < 7) return d.toLocaleDateString([], {weekday:'short'}) + ' ' + t;
  return d.toLocaleDateString([], {month:'short', day:'numeric'});
}

function rid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

async function uploadDamagePhoto(file, itemId){
  const blob = await compressImage(file);
  const path = `${JOB.id}/${itemId}/${rid()}.jpg`;
  const { error } = await sb.storage.from('damage-photos')
    .upload(path, blob, { contentType:'image/jpeg' });
  if(error) throw error;
  const ins = await withRetry(() => sb.from('item_photos')
    .insert({ inspection_item_id:itemId, storage_path:path }).select().single());
  if(ins.error) throw ins.error;
  return ins.data;
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setHeader(title, sub, opts={}){

  tbSub.textContent = sub || '';

/* Mobile signal drops mid-request and Safari throws "Load failed" even when
   the write already landed. Retry quietly before ever bothering the tech. */
async function withRetry(fn, tries=3){
  let lastErr;
  for(let i=0;i<tries;i++){
    try{
      const res = await fn();
      if(res && res.error){ lastErr = res.error; }
      else return res;
    } catch(e){ lastErr = e; }
    if(i < tries-1) await new Promise(r=>setTimeout(r, 600*(i+1)));
  }
  return { error: lastErr };
}

/* ============================================================
   AUTH
   ============================================================ */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ return screenLogin(); }
  const { data:profile, error } = await sb
    .from('profiles').select('*').eq('id', session.user.id).single();
  if(error || !profile){
    app.innerHTML = banner('Signed in, but no profile found. Ask the admin to set up your account.');
    setFooter(`<button class="btn ghost" onclick="signOut()">Sign out</button>`);
    return;
  }
  ME = profile;
  await loadReference();
  screenHome();
}

async function loadReference(){
  const [z, c] = await Promise.all([
    sb.from('zone_items').select('*').eq('active', true).order('sort_order'),
    sb.from('defect_codes').select('*').order('sort_order')
  ]);
  ZONES = z.data || [];
  CODES = c.data || [];
  // group into ordered sections
  SECTIONS = [];
  let cur = null;
  for(const item of ZONES){
    if(!cur || cur.section !== item.section || cur.surface !== item.surface){
      cur = { surface:item.surface, section:item.section, optional:item.optional, items:[] };
      SECTIONS.push(cur);
    }
    cur.items.push(item);
  }
}

async function openJob(id){

  JOB = job;
  const { data:insps } = await sb.from('inspections').select('*').eq('job_id', id);
  const pre  = (insps||[]).find(i => i.phase === 'pre');
  const post = (insps||[]).find(i => i.phase === 'post');

  if(!pre){ await startInspection(); return; }
  if(!pre.completed_at){ INSPECTION = pre; await resumeInspection(); return; }
  if(post && post.completed_at){ INSPECTION = post; await screenJobDone(pre, post); return; }
  if(post){ INSPECTION = post; await resumePost(); return; }
  screenPostIntro(pre);
}

async function screenJobDone(pre, post){

  setProgress(null); setFooter(null);

}

/* ============================================================
   INSPECTION
   ============================================================ */
async function startInspection(){
  const { data, error } = await withRetry(() => sb.from('inspections').insert({
    job_id: JOB.id, phase:'pre', tech_id: ME.id
  }).select().single());
  if(error){ app.innerHTML = banner('Could not start inspection: ' + error.message); return; }
  INSPECTION = data; STATE = {}; SIDX = 0;
  screenSection();
}

async function resumeInspection(){
  const { data:items } = await sb.from('inspection_items')
    .select('*').eq('inspection_id', INSPECTION.id);
  STATE = {};
  for(const it of (items||[])){
    STATE[it.zone_item_id] = {
      condition: it.condition, effort: it.effort,
      na: it.not_applicable, codes: it.defect_codes || [], note: it.note || ''
    };
  }
  SIDX = 0;
  for(let i=0;i<SECTIONS.length;i++){
    if(SECTIONS[i].items.some(z => !STATE[z.id])){ SIDX = i; break; }
    SIDX = i;
  }
  screenSection();
}

function sectionDoneCount(sec){
  return sec.items.filter(z => STATE[z.id] && (STATE[z.id].condition || STATE[z.id].na)).length;
}
function overallProgress(){
  const done = ZONES.filter(z => STATE[z.id] && (STATE[z.id].condition || STATE[z.id].na)).length;
  return Math.round(done / ZONES.length * 100);
}

let SECTION_ENTERED_AT = 0;

function screenSection(){
  const sec = SECTIONS[SIDX];
  SECTION_ENTERED_AT = Date.now();
  setHeader(sec.section, `${JOB.job_number} · ${sec.surface === 'exterior' ? 'Exterior':'Interior'} · Section ${SIDX+1} of ${SECTIONS.length}`, {back:true});
  setProgress(overallProgress());
  btnBack.onclick = () => { if(SIDX>0){ SIDX--; screenSection(); } else screenHome(); };

  app.innerHTML = `
    <div class="sect">
      <span>${esc(sec.section)}</span>
      <span class="cnt" id="secCnt">${sectionDoneCount(sec)} of ${sec.items.length}</span>
    </div>
    <div class="rows" id="rows">
      ${sec.items.map(z => rowHTML(z)).join('')}
    </div>
    ${ sec.optional ? `<button class="btn ghost" onclick="markSectionNA()">Not equipped — skip this section</button>` : '' }
    <button class="btn ghost" onclick="markSectionGood()">Mark all remaining as Good</button>`;

  setFooter(`
    ${ SIDX>0 ? `<button class="btn ghost" onclick="prevSection()">Previous</button>` : '' }
    <button class="btn primary" id="nextBtn" onclick="nextSection()"></button>`);

  bindRows();
  refreshNextBtn();
}

/* Next stays locked until every zone in the section has an answer.
   N/A counts as an answer — that is the escape hatch, not a blank. */
function refreshNextBtn(){
  const btn = document.getElementById('nextBtn');
  if(!btn) return;
  const sec = SECTIONS[SIDX];
  const left = sec.items.length - sectionDoneCount(sec);
  const last = SIDX === SECTIONS.length - 1;
  if(left > 0){
    btn.disabled = true;
    btn.textContent = `${left} left to mark`;
  } else {
    btn.disabled = false;
    btn.textContent = last ? 'Finish inspection' : 'Next section';
  }
}

function rowHTML(z){
  const s = STATE[z.id] || {};
  const showDetail = s.condition === 'average' || s.condition === 'poor';
  return `
  <div class="row ${ (s.condition||s.na) ? 'done':'' }" data-zid="${z.id}">
    <div class="row-main">
      <div class="row-label">${esc(z.item_label)}</div>
      <div class="marks">
        <button class="mark ${s.condition==='good'?'on':''}"    data-v="good"    aria-label="Good">G</button>
        <button class="mark ${s.condition==='average'?'on':''}" data-v="average" aria-label="Average">A</button>
        <button class="mark ${s.condition==='poor'?'on':''}"    data-v="poor"    aria-label="Poor">P</button>
        <button class="mark ${s.na?'on':''}"                    data-v="na"      aria-label="Not applicable">N/A</button>
      </div>
    </div>
    <div class="detail ${showDetail?'':'hidden'}">
      <div class="lbl">What is it?</div>
      <div class="chips codes">
        ${CODES.map(c=>`<button class="chip ${ (s.codes||[]).includes(c.code)?'on':'' }" data-code="${c.code}">${esc(c.code)} ${esc(c.label)}</button>`).join('')}
      </div>
      <div class="lbl">Work needed</div>
      <div class="chips efforts">
        ${['minimal','standard','extended'].map(ef=>`<button class="chip ${s.effort===ef?'on':''}" data-effort="${ef}">${EFFORT_LABEL[ef]}</button>`).join('')}
      </div>
      <div class="photobar ${ (s.photos||0) ? 'has':'' }">
        <label class="photobtn">
          <span class="plabel">${ (s.photos||0) ? photoLabel(s.photos) : 'Add damage photo' }</span>
          <span class="addmore">Add another</span>
          <input type="file" accept="image/*" capture="environment" class="photoin" hidden>
        </label>
      </div>
      <input class="note" placeholder="Note (optional)" value="${esc(s.note||'')}">
    </div>
  </div>`;
}

function bindRows(){
  document.querySelectorAll('.row').forEach(row=>{
    const zid = +row.dataset.zid;
    row.querySelectorAll('.mark').forEach(btn=>{
      btn.onclick = () => {
        const v = btn.dataset.v;
        const s = STATE[zid] || { codes:[], note:'' };
        if(v === 'na'){
          s.na = !s.na;
          if(s.na){ s.condition = null; s.effort = null; s.codes = []; }
        } else {
          s.na = false;
          s.condition = (s.condition === v) ? null : v;
          s.effort = s.condition ? (s.effort || EFFORT_DEFAULT[s.condition] || null) : null;
          if(s.condition === 'good' || !s.condition) s.codes = [];
        }
        STATE[zid] = s;
        redrawRow(row, zid);
      };
    });
    wireDetail(row, zid);
  });
}

function wireDetail(row, zid){
  row.querySelectorAll('.codes .chip').forEach(chip=>{
    chip.onclick = () => {
      const s = STATE[zid]; if(!s) return;
      const code = chip.dataset.code;
      s.codes = s.codes || [];
      const i = s.codes.indexOf(code);
      if(i >= 0) s.codes.splice(i,1); else s.codes.push(code);
      chip.classList.toggle('on');
    };
  });
  row.querySelectorAll('.efforts .chip').forEach(chip=>{
    chip.onclick = () => {
      const s = STATE[zid]; if(!s) return;
      s.effort = chip.dataset.effort;
      row.querySelectorAll('.efforts .chip').forEach(c=>c.classList.remove('on'));
      chip.classList.add('on');
    };
  });
  const note = row.querySelector('.note');
  if(note) note.oninput = () => { if(STATE[zid]) STATE[zid].note = note.value; };
  wirePhoto(row, zid, STATE);
}

/* A photo needs a saved item row to attach to, so the row is written
   first, then the file uploads against its id. */
function wirePhoto(row, zid, store, onDone){
  const input = row.querySelector('.photoin');
  if(!input) return;
  const bar = row.querySelector('.photobar');
  const plabel = row.querySelector('.plabel');
  input.onchange = async () => {
    const file = input.files && input.files[0];
    input.value = '';
    if(!file) return;
    const s = store[zid]; if(!s) return;
    plabel.textContent = 'Uploading…';
    try{
      let itemId = s.itemId;
      if(!itemId){
        const payload = (store === STATE)
          ? { inspection_id:INSPECTION.id, zone_item_id:zid,
              condition:s.condition||null, effort:s.effort||null,
              not_applicable:!!s.na, defect_codes:s.codes||[], note:s.note||null }
          : { inspection_id:INSPECTION.id, zone_item_id:zid,
              outcome:s.outcome||null, not_applicable:false,
              defect_codes:s.codes||[], note:s.note||null };
        const r = await withRetry(() => sb.from('inspection_items')
          .upsert(payload, { onConflict:'inspection_id,zone_item_id' })
          .select().single());
        if(r.error) throw r.error;
        itemId = r.data.id; s.itemId = itemId;
      }
      await uploadDamagePhoto(file, itemId);
      s.photos = (s.photos||0) + 1;
      bar.classList.add('has');
    } catch(e){
      alert('Photo did not upload: ' + (e.message||e));
    }
    plabel.textContent = (s.photos||0) ? photoLabel(s.photos) : 'Add damage photo';
    if(onDone) onDone();
  };
}

function photoLabel(n){ return `${n} photo${n===1?'':'s'} attached`; }

function redrawRow(row, zid){
  const s = STATE[zid] || {};
  row.querySelectorAll('.mark').forEach(b=>{
    const v = b.dataset.v;
    b.classList.toggle('on', v === 'na' ? !!s.na : s.condition === v);
  });
  row.classList.toggle('done', !!(s.condition || s.na));
  const det = row.querySelector('.detail');
  const show = s.condition === 'average' || s.condition === 'poor';
  det.classList.toggle('hidden', !show);
  if(show){
    det.querySelectorAll('.efforts .chip').forEach(c=>
      c.classList.toggle('on', c.dataset.effort === s.effort));
    det.querySelectorAll('.codes .chip').forEach(c=>
      c.classList.toggle('on', (s.codes||[]).includes(c.dataset.code)));
  }
  document.getElementById('secCnt').textContent =
    `${sectionDoneCount(SECTIONS[SIDX])} of ${SECTIONS[SIDX].items.length}`;
  setProgress(overallProgress());
  refreshNextBtn();
}

function markSectionGood(){
  const sec = SECTIONS[SIDX];
  let n = 0;
  for(const z of sec.items){
    const s = STATE[z.id];
    if(!s || (!s.condition && !s.na)){
      STATE[z.id] = { condition:'good', effort:null, na:false, codes:[], note:'' };
      n++;
    }
  }
  logBulkMark('all_good', sec, n);
  screenSection();
}

function markSectionNA(){
  const sec = SECTIONS[SIDX];
  for(const z of sec.items){
    STATE[z.id] = { condition:null, effort:null, na:true, codes:[], note:'' };
  }
  logBulkMark('section_na', sec, sec.items.length);
  screenSection();
}

/* Logged for the owner only. Techs can write here but cannot read
   it back, so the record can't be tidied up after the fact. */
function logBulkMark(action, sec, n){
  const secs = SECTION_ENTERED_AT
    ? Math.round((Date.now() - SECTION_ENTERED_AT)/1000) : null;
  sb.from('bulk_marks').insert({
    inspection_id: INSPECTION.id,
    job_id: JOB.id,
    user_id: ME.id,
    phase: 'pre',
    surface: sec.surface,
    section: sec.section,
    action,
    items_marked: n,
    section_total: sec.items.length,
    seconds_in_section: secs
  }).then(()=>{}, ()=>{});   // never block the tech on this
}

async function saveSection(){
  const rows = SECTIONS[SIDX].items
    .filter(z => STATE[z.id] && (STATE[z.id].condition || STATE[z.id].na))
    .map(z => ({
      inspection_id: INSPECTION.id,
      zone_item_id: z.id,
      condition: STATE[z.id].condition || null,
      effort: STATE[z.id].effort || null,
      not_applicable: !!STATE[z.id].na,
      defect_codes: STATE[z.id].codes || [],
      note: STATE[z.id].note || null,
      updated_at: new Date().toISOString()
    }));
  if(!rows.length) return { error:null };
  return await withRetry(() => sb.from('inspection_items')
    .upsert(rows, { onConflict:'inspection_id,zone_item_id' }));
}

async function prevSection(){ await saveSection(); SIDX--; screenSection(); }

async function nextSection(){
  const sec = SECTIONS[SIDX];
  if(sectionDoneCount(sec) < sec.items.length) return;   // guard; button is disabled anyway
  const btn = document.getElementById('nextBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await saveSection();
  if(error){
    alert('Could not save after a few tries — check your signal and tap Next again.\n\n' + error.message);
    refreshNextBtn();
    return;
  }
  if(SIDX === SECTIONS.length - 1){ screenSummary(); }
  else { SIDX++; screenSection(); }
}

/* ============================================================
   SUMMARY
   ============================================================ */
async function screenSummary(){
  setHeader('Inspection summary', JOB.job_number + ' · ' + JOB.vehicle, {back:true});
  setProgress(100);
  btnBack.onclick = () => { SIDX = SECTIONS.length-1; screenSection(); };

  const counts = { good:0, average:0, poor:0, na:0 };
  const flagged = [];
  for(const z of ZONES){
    const s = STATE[z.id]; if(!s) continue;
    if(s.na){ counts.na++; continue; }
    if(s.condition){ counts[s.condition]++; }
    if(s.condition === 'average' || s.condition === 'poor'){
      flagged.push({ z, s });
    }
  }

  const noPhoto = flagged.filter(({s}) => !(s.photos||0)).length;

  app.innerHTML = `
    <div class="tiles">
      <div class="tile g"><b>${counts.good}</b><span>Good</span></div>
      <div class="tile a"><b>${counts.average}</b><span>Average</span></div>
      <div class="tile p"><b>${counts.poor}</b><span>Poor</span></div>
    </div>
    <p class="note">${counts.na} marked not applicable · ${ZONES.length} zones total</p>

    ${ noPhoto > 0 ? `<div class="banner warn">
        <strong>${noPhoto} flagged item${noPhoto===1?'':'s'} ${noPhoto===1?'has':'have'} no photo.</strong>
        Not required — but a photo is what settles the argument later. Go back if any of
        these need one.</div>` : '' }

    <h2>Flagged for post-inspection</h2>
    ${ flagged.length === 0
      ? `<p class="note">Nothing flagged. The post-inspection will have no carry-forward items.</p>`
      : flagged.map(({z,s})=>`
        <div class="flagline mini sumrow" data-zid="${z.id}">
          <span class="dot ${s.condition}"></span>
          <span style="flex:1">${esc(z.section)} — ${esc(z.item_label)}
            <br><span class="cd">${ (s.codes||[]).join(' ') || 'no code' }</span>
            ${ s.note ? ` <span class="cd" style="font-weight:500">· ${esc(s.note)}</span>` : '' }</span>
          <span class="photobar mini ${ (s.photos||0) ? 'has':'' }">
            <label class="photobtn">
              <span class="plabel">${ (s.photos||0) ? photoLabel(s.photos) : 'Add photo' }</span>
              <span class="addmore"></span>
              <input type="file" accept="image/*" capture="environment" class="photoin" hidden>
            </label>
          </span>
        </div>`).join('') }

    <div class="card" style="margin-top:20px">
      <h3>Overall notes</h3>
      <input class="note" id="overallNote" placeholder="Anything else worth recording"
             value="${esc(INSPECTION.notes||'')}"
             style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px">
    </div>`;

  setFooter(`<button class="btn primary" id="finBtn" onclick="finishInspection()">Continue to agreement</button>`);

  // Last chance to attach evidence before the client signs.
  document.querySelectorAll('.sumrow').forEach(row=>{
    wirePhoto(row, +row.dataset.zid, STATE, () => {
      const note = document.getElementById('overallNote');
      const keep = note ? note.value : '';
      screenSummary();
      const n2 = document.getElementById('overallNote');
      if(n2) n2.value = keep;
    });
  });
}

async function finishInspection(){
  const btn = document.getElementById('finBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const allRows = ZONES
    .filter(z => STATE[z.id] && (STATE[z.id].condition || STATE[z.id].na))
    .map(z => ({
      inspection_id: INSPECTION.id,
      zone_item_id: z.id,
      condition: STATE[z.id].condition || null,
      effort: STATE[z.id].effort || null,
      not_applicable: !!STATE[z.id].na,
      defect_codes: STATE[z.id].codes || [],
      note: STATE[z.id].note || null,
      updated_at: new Date().toISOString()
    }));

  const up = await withRetry(() => sb.from('inspection_items')
    .upsert(allRows, { onConflict:'inspection_id,zone_item_id' }));
  if(up.error){
    alert('Could not save after a few tries — check your signal and tap Continue again.\n\n' + up.error.message);

  await withRetry(() => sb.from('inspections').update({

/* ============================================================
   SIGN-OFF — agreement, signature capture, lock
   ============================================================ */

let SIGPAD = null;   // {canvas, ctx, dirty}

function sigPadHTML(){
  return `
    <div class="sigwrap">
      <canvas id="sigpad" class="sigpad"></canvas>
      <div class="sighint" id="sighint">Sign here with your finger</div>
    </div>
    <button class="btn ghost" style="margin-top:8px" onclick="clearSig()">Clear signature</button>`;
}

function initSigPad(){
  const c = document.getElementById('sigpad');
  if(!c) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = c.getBoundingClientRect();
  c.width = rect.width * ratio;
  c.height = rect.height * ratio;
  const ctx = c.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#14181c';
  SIGPAD = { canvas:c, ctx, dirty:false };

  let drawing = false, lx=0, ly=0;
  const pos = e => {
    const r = c.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:p.clientX - r.left, y:p.clientY - r.top };
  };
  const start = e => {
    e.preventDefault(); drawing = true;
    const p = pos(e); lx = p.x; ly = p.y;
    if(!SIGPAD.dirty){
      SIGPAD.dirty = true;
      const h = document.getElementById('sighint'); if(h) h.style.display='none';
      refreshSignBtn();
    }
  };
  const move = e => {
    if(!drawing) return; e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p.x, p.y); ctx.stroke();
    lx = p.x; ly = p.y;
  };
  const end = () => { drawing = false; };

  c.addEventListener('touchstart', start, {passive:false});
  c.addEventListener('touchmove',  move,  {passive:false});
  c.addEventListener('touchend',   end);
  c.addEventListener('mousedown',  start);
  c.addEventListener('mousemove',  move);
  window.addEventListener('mouseup', end);
}

function clearSig(){
  if(!SIGPAD) return;
  const { canvas, ctx } = SIGPAD;
  const ratio = window.devicePixelRatio || 1;
  ctx.clearRect(0,0,canvas.width/ratio, canvas.height/ratio);
  SIGPAD.dirty = false;
  const h = document.getElementById('sighint'); if(h) h.style.display='';
  refreshSignBtn();
}

function sigBlob(){
  return new Promise(res => {
    if(!SIGPAD || !SIGPAD.dirty) return res(null);
    SIGPAD.canvas.toBlob(b => res(b), 'image/png');
  });
}

let SIGNOFF_MODE = 'signed';   // 'signed' | 'absent' | 'declined'
let SIGNOFF_PHASE = 'pre';

function screenSignoff(phase){
  SIGNOFF_PHASE = phase;
  SIGNOFF_MODE = 'signed';
  const isPre = phase === 'pre';
  setHeader(isPre ? 'Agreement and sign-off' : 'Client sign-off',
            JOB.job_number + ' · ' + JOB.vehicle, {back:true});
  setProgress(100);
  btnBack.onclick = () => isPre ? screenSummary() : screenPostSummary();

  app.innerHTML = `
    ${ isPre ? `
      <div class="card agreement">
        <h3 style="color:var(--ink);font-size:16px">${esc(AGREEMENT_TITLE)}</h3>
        ${AGREEMENT_BODY.map(([h,b])=>`
          <div class="agsec"><div class="agh">${esc(h)}</div><p>${esc(b)}</p></div>`).join('')}
      </div>` : '' }

    <div class="card">
      <h3>Is the client here?</h3>
      <div class="chips" style="margin-bottom:4px">
        <button class="chip out on" data-mode="signed">Yes — signing now</button>
        <button class="chip out" data-mode="absent">Not present</button>
        ${ isPre ? '' : `<button class="chip out" data-mode="declined">Declined to sign</button>` }
      </div>
    </div>

    <div class="card" id="signedBox">
      <p class="ack">${esc(isPre ? PRE_ACK : POST_ACK)}</p>
      <label class="f"><span>Legal name</span><input id="sigName" autocomplete="name"></label>
      ${sigPadHTML()}
    </div>

    <div class="card hidden" id="absentBox">
      <p class="note" id="absentCopy"></p>
      <label class="f"><span>Your name (attesting)</span>
        <input id="attestName" value="${esc(ME.full_name||'')}"></label>
    </div>`;

  document.querySelectorAll('.chip.out[data-mode]').forEach(btn=>{
    btn.onclick = () => {
      SIGNOFF_MODE = btn.dataset.mode;
      document.querySelectorAll('.chip.out[data-mode]').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      const signed = SIGNOFF_MODE === 'signed';
      document.getElementById('signedBox').classList.toggle('hidden', !signed);
      document.getElementById('absentBox').classList.toggle('hidden', signed);
      document.getElementById('absentCopy').textContent =
        SIGNOFF_MODE === 'declined'
          ? 'Recorded as declined. Note this on the job and raise it with the owner.'
          : 'Recorded as not present, timestamped and attributed to you. The client gets a copy of this report to review.';
      if(signed) setTimeout(initSigPad, 30);
      refreshSignBtn();
    };
  });

  setFooter(`<button class="btn primary" id="signBtn" onclick="submitSignoff()"></button>`);
  setTimeout(initSigPad, 30);
  const nameEl = document.getElementById('sigName');
  if(nameEl) nameEl.oninput = refreshSignBtn;
  refreshSignBtn();
}

function refreshSignBtn(){
  const btn = document.getElementById('signBtn');
  if(!btn) return;
  const isPre = SIGNOFF_PHASE === 'pre';
  const label = isPre ? 'Complete pre-inspection' : 'Complete post-inspection';
  if(SIGNOFF_MODE !== 'signed'){ btn.disabled = false; btn.textContent = label; return; }
  const name = (document.getElementById('sigName')||{}).value || '';
  const ok = name.trim().length > 1 && SIGPAD && SIGPAD.dirty;
  btn.disabled = !ok;
  btn.textContent = ok ? label
    : (!name.trim() ? 'Enter the client\u2019s name' : 'Signature needed');
}

async function saveSignature(){
  if(SIGNOFF_MODE === 'signed'){
    const blob = await sigBlob();
    if(!blob) throw new Error('No signature captured.');
    const path = `${JOB.id}/${SIGNOFF_PHASE}-${rid()}.png`;
    const up = await sb.storage.from('signatures')
      .upload(path, blob, { contentType:'image/png' });
    if(up.error) throw up.error;
    const ins = await withRetry(() => sb.from('signatures').upsert({
      inspection_id: INSPECTION.id,
      signer_name: document.getElementById('sigName').value.trim(),
      signer_role: 'customer',
      storage_path: path
    }, { onConflict:'inspection_id,signer_role' }));
    if(ins.error) throw ins.error;
    return `Signed by ${document.getElementById('sigName').value.trim()}`;
  }
  const who = (document.getElementById('attestName')||{}).value || ME.full_name;
  const word = SIGNOFF_MODE === 'declined' ? 'declined to sign' : 'was not present';
  return `Client ${word}. Attested by ${who} at ${new Date().toLocaleString()}.`;
}

async function submitSignoff(){
  const btn = document.getElementById('signBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  let stamp;
  try { stamp = await saveSignature(); }
  catch(e){ alert('Could not save the signature: ' + (e.message||e)); refreshSignBtn(); return; }
  if(SIGNOFF_PHASE === 'pre') await commitPre(stamp);
  else await commitPost(stamp);
}


let CARRIED = [];   // [{zone, pre:{condition,effort,codes,note}}]
let POST = {};      // zone_item_id -> {outcome, codes:[], note, isNew}

const OUTCOME_LABEL = {
  resolved:'Resolved', still_present:'Still there', new_issue:'New issue'
};

        ${ZONES.length}. Anything you find that wasn't flagged before gets added

    </div>`;
  setFooter(`<button class="btn primary" id="startPost" onclick="startPost()">Start post-inspection</button>`);

async function startPost(){
  const btn = document.getElementById('startPost');
  if(btn){ btn.disabled = true; btn.textContent = 'Starting…'; }
  const { data, error } = await withRetry(() => sb.from('inspections').insert({
    job_id: JOB.id, phase:'post', tech_id: ME.id
  }).select().single());
  if(error){ app.innerHTML = banner('Could not start: ' + error.message); return; }
  INSPECTION = data; POST = {};
  await loadCarried();
  screenPost();
}

async function resumePost(){
  await loadCarried();
  const { data:items } = await sb.from('inspection_items')
    .select('*').eq('inspection_id', INSPECTION.id);
  POST = {};
  for(const it of (items||[])){
    POST[it.zone_item_id] = {
      outcome: it.outcome,
      codes: it.defect_codes || [],
      note: it.note || '',
      isNew: it.outcome === 'new_issue' && !CARRIED.some(c => c.zone.id === it.zone_item_id)
    };
  }
  screenPost();
}

async function loadCarried(){
  const { data:flags } = await sb.from('flagged_from_pre')
    .select('*').eq('job_id', JOB.id).order('sort_order');
  CARRIED = (flags||[]).map(f => ({
    zone: ZONES.find(z => z.id === f.zone_item_id) || {
      id:f.zone_item_id, section:f.section, item_label:f.item_label, surface:f.surface
    },
    pre: { condition:f.pre_condition, effort:f.pre_effort,
           codes:f.pre_defect_codes || [], note:f.pre_note }
  })).filter(c => c.zone);
}

function postAnsweredCount(){
  const carriedDone = CARRIED.filter(c => POST[c.zone.id] && POST[c.zone.id].outcome).length;
  return carriedDone;
}

function screenPost(){
  setHeader('Post-inspection', `${JOB.job_number} · ${postAnsweredCount()} of ${CARRIED.length} checked`, {back:true});
  setProgress(CARRIED.length ? Math.round(postAnsweredCount()/CARRIED.length*100) : 100);
  btnBack.onclick = screenHome;

  const newOnes = Object.entries(POST)
    .filter(([zid, v]) => v.isNew)
    .map(([zid, v]) => ({ zone: ZONES.find(z => z.id === +zid), v }))
    .filter(x => x.zone);

  app.innerHTML = `
    ${ CARRIED.length === 0
      ? `<div class="card"><p class="note">The pre-inspection flagged nothing, so
           there's nothing to re-check. Add any new issues you found below.</p></div>`
      : `<div class="sect"><span>Flagged before service</span>
           <span class="cnt">${postAnsweredCount()} of ${CARRIED.length}</span></div>
         <div class="rows">${CARRIED.map(c => carriedRowHTML(c)).join('')}</div>` }

    <div class="rows">
      ${ newOnes.length === 0
        ? `<div class="row"><p class="note" style="margin:2px 0">Nothing added. If you
             found damage that wasn't flagged before, add it here — the client needs to
             know before handoff.</p></div>`
        : newOnes.map(x => newIssueRowHTML(x.zone, x.v)).join('') }

      </div>
      <div class="photobar ${ (s.photos||0) ? 'has':'' }">

function bindCarriedRows(){
  document.querySelectorAll('.row.prow').forEach(row=>{
    const zid = +row.dataset.zid;
    row.querySelectorAll('.chip.out').forEach(btn=>{
      btn.onclick = () => {
        const s = POST[zid] || { codes:[], note:'', isNew:false };
        const v = btn.dataset.out;
        s.outcome = (s.outcome === v) ? null : v;
        if(s.outcome !== 'still_present') s.codes = [];
        POST[zid] = s;
        redrawCarried(row, zid);
      };
    });
    wirePostDetail(row, zid);
  });
}

function redrawCarried(row, zid){
  const s = POST[zid] || {};
  row.querySelectorAll('.chip.out').forEach(b=>{
    const v = b.dataset.out;
    b.classList.toggle('on', s.outcome === v);
    b.classList.toggle('ok',  s.outcome === v && v === 'resolved');
    b.classList.toggle('bad', s.outcome === v && v === 'still_present');
  });
  row.classList.toggle('done', !!s.outcome);
  const det = row.querySelector('.detail');
  const show = s.outcome === 'still_present';
  det.classList.toggle('hidden', !show);
  if(show){
    det.querySelectorAll('.codes .chip').forEach(c=>
      c.classList.toggle('on', (s.codes||[]).includes(c.dataset.code)));
  }
  setHeader('Post-inspection', `${JOB.job_number} · ${postAnsweredCount()} of ${CARRIED.length} checked`, {back:true});
  setProgress(CARRIED.length ? Math.round(postAnsweredCount()/CARRIED.length*100) : 100);
  refreshPostBtn();
}

function bindNewRows(){
  document.querySelectorAll('.row.nrow').forEach(row=>{
    const zid = +row.dataset.zid;
    const rm = row.querySelector('[data-remove]');
    if(rm) rm.onclick = () => { delete POST[zid]; screenPost(); };
    wirePostDetail(row, zid);
  });
}

function wirePostDetail(row, zid){
  row.querySelectorAll('.codes .chip').forEach(chip=>{
    chip.onclick = () => {
      const s = POST[zid]; if(!s) return;
      s.codes = s.codes || [];
      const i = s.codes.indexOf(chip.dataset.code);
      if(i>=0) s.codes.splice(i,1); else s.codes.push(chip.dataset.code);
      chip.classList.toggle('on');
    };
  });
  const note = row.querySelector('.note');
  if(note) note.oninput = () => { if(POST[zid]) POST[zid].note = note.value; };
  wirePhoto(row, zid, POST);
}

function refreshPostBtn(){
  const btn = document.getElementById('postNext');
  if(!btn) return;
  const left = CARRIED.length - postAnsweredCount();
  if(left > 0){ btn.disabled = true; btn.textContent = `${left} left to check`; }
  else { btn.disabled = false; btn.textContent = 'Review and finish'; }
}

/* ---------- post summary ---------- */
function screenPostSummary(){
  setHeader('Post-inspection summary', JOB.job_number + ' · ' + JOB.vehicle, {back:true});
  setProgress(100);
  btnBack.onclick = screenPost;

  let resolved=0, still=0;
  const stillList=[], newList=[];
  for(const c of CARRIED){
    const s = POST[c.zone.id]; if(!s) continue;
    if(s.outcome === 'resolved') resolved++;
    if(s.outcome === 'still_present'){ still++; stillList.push({zone:c.zone, s}); }
  }
  for(const [zid, v] of Object.entries(POST)){
    if(v.isNew){ const z = ZONES.find(z=>z.id === +zid); if(z) newList.push({zone:z, s:v}); }
  }

  const mustTell = stillList.length + newList.length;
  const postNoPhoto = [...stillList, ...newList].filter(x => !(x.s.photos||0)).length;

  app.innerHTML = `
    <div class="tiles">
      <div class="tile g"><b>${resolved}</b><span>Resolved</span></div>
      <div class="tile a"><b>${still}</b><span>Still there</span></div>
      <div class="tile p"><b>${newList.length}</b><span>New</span></div>
    </div>

    ${ mustTell > 0 ? `
      <div class="banner err" style="font-weight:600">
        Tell the client about ${mustTell} item${mustTell===1?'':'s'} before they take the car.
      </div>` : `<div class="banner ok">Everything flagged was resolved. Nothing to raise at handoff.</div>` }

    ${ postNoPhoto > 0 ? `<div class="banner warn">
        <strong>${postNoPhoto} of those ${postNoPhoto===1?'has':'have'} no photo.</strong>
        A new issue without a photo is hard to defend if the client disputes it.</div>` : '' }

    ${ stillList.length ? `<h2>Still there</h2>` + stillList.map(({zone,s})=>postSumRow(zone,s,'average')).join('') : '' }

    ${ newList.length ? `<h2>New issues</h2>` + newList.map(({zone,s})=>postSumRow(zone,s,'poor')).join('') : '' }

    <div class="card" style="margin-top:20px">
      <h3>Handoff notes</h3>
      <input class="note" id="postNote" placeholder="Anything else worth recording"
             value="${esc(INSPECTION.notes||'')}"
             style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px">
    </div>`;

  setFooter(`<button class="btn primary" id="finPost" onclick="finishPost()">Continue to sign-off</button>`);

  document.querySelectorAll('.psumrow').forEach(row=>{

      const note = document.getElementById('postNote');

      screenPostSummary();

      if(n2) n2.value = keep;
    });
  });
}

async function finishPost(){
  const btn = document.getElementById('finPost');
  btn.disabled = true; btn.textContent = 'Saving…';

  const rows = Object.entries(POST)
    .filter(([zid, v]) => v.outcome)
    .map(([zid, v]) => ({
      inspection_id: INSPECTION.id,
      zone_item_id: +zid,
      outcome: v.outcome,
      defect_codes: v.codes || [],
      note: v.note || null,
      not_applicable: false,
      updated_at: new Date().toISOString()
    }));

  if(rows.length){
    const up = await withRetry(() => sb.from('inspection_items')
      .upsert(rows, { onConflict:'inspection_id,zone_item_id' }));
    if(up.error){
      alert('Could not save after a few tries — check your signal and tap Continue again.\n\n' + up.error.message);
      btn.disabled=false; btn.textContent='Continue to sign-off'; return;
    }
  }

  await withRetry(() => sb.from('inspections').update({
    notes: document.getElementById('postNote').value || null
  }).eq('id', INSPECTION.id));

  screenSignoff('post');
}

async function commitPost(stamp){
  await withRetry(() => sb.from('inspections').update({
    completed_at: new Date().toISOString(),
    locked: true,
    locked_at: new Date().toISOString(),
    notes: ((INSPECTION.notes ? INSPECTION.notes + ' — ' : '') + stamp)
  }).eq('id', INSPECTION.id));

  await withRetry(() => sb.from('jobs').update({
    status:'complete', updated_at:new Date().toISOString()
  }).eq('id', JOB.id));

  app.innerHTML = `
    ${banner('Post-inspection complete and locked.','ok')}
    <div class="card">
      <h3>${esc(JOB.job_number)}</h3>
      <p class="note">${esc(JOB.vehicle)} — ${esc(JOB.customer_name)}</p>
      <p class="note">${esc(stamp)}</p>
      <p class="note">Make sure the 12 after photos are in Fieldd.</p>
    </div>
    ${await shareBlock()}`;
  setFooter(`<button class="btn primary" onclick="screenHome()">Back to jobs</button>`);
  setProgress(null);
}

   ============================================================ */
async function shareBlock(){
  return `
    <div class="card" id="shareCard">
      <h3>Send the report to the client</h3>
      <p class="note">Copy the link, then paste it into the Fieldd chat for this job.
        They'll get an SMS and can open it on their phone. Link works for 60 days.</p>
      <button class="btn blue" id="shareBtn" onclick="doShare()">Copy report link</button>
      <div id="shareOut"></div>
    </div>`;
}

async function doShare(){
  const btn = document.getElementById('shareBtn');
  btn.disabled = true; btn.textContent = 'Creating link…';
  const { data, error } = await withRetry(() =>
    sb.rpc('mint_share_token', { p_job_id: JOB.id }));
  if(error || !data){
    document.getElementById('shareOut').innerHTML =
      banner('Could not create the link: ' + ((error&&error.message)||'unknown'));
    btn.disabled = false; btn.textContent = 'Copy report link';
    return;
  }
  const url = `${location.origin}${location.pathname.replace(/[^/]*$/,'')}report.html?t=${data}`;

  let copied = false;
  try { await navigator.clipboard.writeText(url); copied = true; } catch(e){}

  document.getElementById('shareOut').innerHTML = `
    ${ copied ? banner('Link copied. Paste it into the Fieldd chat.','ok') : '' }
    <input class="note" readonly value="${esc(url)}"
      onclick="this.select()"
      style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;
             margin-top:8px;font-size:13px">
    ${ navigator.share ? `<button class="btn ghost" onclick="nativeShare('${esc(url)}')">Share…</button>` : '' }
    <a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener"
       style="text-decoration:none;display:block">Preview what the client sees</a>`;
  btn.disabled = false; btn.textContent = 'Copy link again';
}

function nativeShare(url){
  if(navigator.share) navigator.share({
    title:'Your vehicle condition report', text:'Your KBC condition report:', url
  }).catch(()=>{});
}

    .order('created_at', { ascending:false }).limit(300);
  HISTORY = data || [];
  document.getElementById('histQ').oninput = renderHistory;
  renderHistory();
}

function renderHistory(){
  const q = (document.getElementById('histQ').value||'').trim().toLowerCase();
  const rows = !q ? HISTORY : HISTORY.filter(j =>
    [j.customer_name, j.vehicle, j.plate_vin, j.job_number]
      .some(v => (v||'').toLowerCase().includes(q)));

  const badge = st =>
      st === 'awaiting_service' ? `<span class="badge post">Post-inspection due</span>`
    : st === 'complete'         ? `<span class="badge done">Complete</span>`
    :                             `<span class="badge pre">Pre in progress</span>`;

  document.getElementById('histOut').innerHTML = rows.length === 0
    ? `<p class="note">Nothing matches that.</p>`
    : `<p class="note">${rows.length} job${rows.length===1?'':'s'}</p>
       <div class="joblist">${rows.map(j=>`
         <button class="job" onclick="openJob('${j.id}')">
           <div class="jn">${esc(j.job_number)} · ${esc(jobDate(j.created_at))}</div>
           <div class="jv">${esc(j.vehicle)}</div>
           <div class="jc">${esc(j.customer_name)}${ j.plate_vin ? ' · '+esc(j.plate_vin) : '' }</div>
           ${badge(j.status)}
         </button>`).join('')}</div>`;
}

/* ============================================================
   ADMIN — bulk-mark audit
   ============================================================ */
async function screenAudit(){
  setHeader('Bulk marking','Owner only',{back:true});
  setProgress(null); setFooter(null);
  btnBack.onclick = screenHome;
  app.innerHTML = `<div class="loading">Loading…</div>`;

  const [sum, recent] = await Promise.all([
    sb.from('bulk_mark_summary').select('*').order('bulk_taps', {ascending:false}),
    sb.from('bulk_marks').select('*, profiles(full_name), jobs(job_number, vehicle)')
      .order('created_at', {ascending:false}).limit(40)
  ]);

  const rows = sum.data || [];
  const log  = recent.data || [];

  app.innerHTML = `
    <p class="note">Every time a tech taps "Mark all remaining as Good" or
      "Not equipped", it's recorded here with how long they'd been on that
      section. Techs can't see this screen.</p>

    <h2>By tech</h2>
    ${ rows.length === 0
      ? `<p class="note">Nothing logged yet.</p>`
      : rows.map(r=>`
        <div class="card">
          <h3 style="color:var(--ink);font-size:16px;margin-bottom:8px">${esc(r.tech)}</h3>
          <dl class="meta2">
            <dt>Bulk taps</dt><dd>${r.bulk_taps}</dd>
            <dt>Items auto-marked</dt><dd>${r.items_auto_marked}</dd>
            <dt>Average time on section</dt><dd>${ r.avg_seconds_in_section ?? '—' }s</dd>
            <dt>Fastest</dt><dd>${ r.fastest_seconds ?? '—' }s</dd>
            <dt>Taps under 15s</dt>
            <dd class="${ r.taps_under_15s > 0 ? 'flagnum':'' }">${r.taps_under_15s}</dd>
          </dl>
        </div>`).join('') }

    <h2>Recent</h2>
    ${ log.length === 0 ? `<p class="note">Nothing yet.</p>` :
      log.map(b=>`
        <div class="flagline">
          <span class="dot ${ (b.seconds_in_section!=null && b.seconds_in_section < 15) ? 'poor':'average' }"></span>
          <span style="flex:1">
            ${esc(b.profiles ? b.profiles.full_name : '')} — ${esc(b.section)}
            <br><span class="cd">${ b.action === 'all_good' ? 'All good' : 'Not equipped' }
              · ${b.items_marked} of ${b.section_total}
              · ${esc(b.jobs ? b.jobs.job_number : '')}</span>
          </span>
          <span class="cd">${ b.seconds_in_section != null ? b.seconds_in_section + 's' : '—' }</span>
        </div>`).join('') }`;
}

boot();
</script>
