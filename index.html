<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A7A">
<title>KBC Inspections</title>
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root{
    --paper:#f4f5f7;
    --card:#ffffff;
    --ink:#14181c;
    --ink-soft:#5a636c;
    --line:#d7dbe0;
    --navy:#1b3a7a;
    --blue:#0b8fd6;
    --good:#1a8a3c;
    --avg:#d99400;
    --poor:#bd2a1d;
    --na:#7b848d;
    --tap:52px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;font-size:17px;}
  .hidden{display:none !important;}

  /* ---------- shell ---------- */
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 120px;}
  .topbar{
    position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .topbar-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1;}
  .topbar .sub{font-size:12.5px;opacity:.82;font-weight:500;margin-top:1px;}
  .iconbtn{
    color:#fff;font-size:14px;font-weight:600;padding:8px 10px;border-radius:8px;
    background:rgba(255,255,255,.14);
  }

  /* ---------- progress ---------- */
  .prog{height:5px;background:rgba(0,0,0,.14);}
  .prog span{display:block;height:100%;background:var(--blue);transition:width .25s ease;}

  /* ---------- cards & type ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;}
  h2{font-size:21px;margin:22px 0 6px;letter-spacing:-.3px;}
  h3{font-size:15px;margin:0 0 10px;color:var(--ink-soft);font-weight:600;}
  p.note{color:var(--ink-soft);font-size:14.5px;margin:6px 0;}

  /* ---------- forms ---------- */
  label.f{display:block;margin:14px 0 0;}
  label.f span{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  label.f input, label.f select{
    width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--ink);
  }
  label.f input:focus, label.f select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}

  .btn{
    display:block;width:100%;text-align:center;padding:16px;border-radius:11px;
    font-weight:700;font-size:17px;margin-top:14px;min-height:var(--tap);
  }
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.blue{background:var(--blue);color:#fff;}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn:disabled{opacity:.45;}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}

  /* ---------- section header ---------- */
  .sect{
    background:var(--navy);color:#fff;padding:11px 14px;border-radius:10px;
    font-weight:700;font-size:16px;margin:18px 0 0;display:flex;justify-content:space-between;gap:10px;
  }
  .sect .cnt{font-weight:600;opacity:.8;font-size:13.5px;white-space:nowrap;}

  /* ---------- inspection rows ---------- */
  .rows{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;}
  .row{border-top:1px solid var(--line);padding:11px 12px;}
  .row:first-child{border-top:none;}
  .row.done{background:#fbfcfd;}
  .row-main{display:flex;align-items:center;gap:10px;}
  .row-label{flex:1;font-size:16px;line-height:1.25;font-weight:500;}
  .marks{display:flex;gap:6px;flex-shrink:0;}
  .mark{
    width:42px;height:44px;border-radius:9px;border:2px solid var(--line);
    background:#fff;font-weight:800;font-size:15px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .mark[data-v="good"].on{background:var(--good);border-color:var(--good);color:#fff;}
  .mark[data-v="average"].on{background:var(--avg);border-color:var(--avg);color:#fff;}
  .mark[data-v="poor"].on{background:var(--poor);border-color:var(--poor);color:#fff;}
  .mark[data-v="na"]{width:36px;font-size:12.5px;}
  .mark[data-v="na"].on{background:var(--na);border-color:var(--na);color:#fff;}
  .mark:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}

  .detail{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);}
  .detail .lbl{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
  .chip{
    padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;
    font-size:14px;font-weight:600;min-height:40px;
  }
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  .chip.out{flex:1;justify-content:center;text-align:center;padding:13px 10px;min-height:48px;}
  .chip.on.ok{background:var(--good);border-color:var(--good);}
  .chip.on.bad{background:var(--poor);border-color:var(--poor);}
  .row.prow{padding:13px 12px;}
  .row.prow .chips{display:flex;gap:8px;}
  .badge{
    display:inline-block;font-size:11.5px;font-weight:800;padding:3px 8px;
    border-radius:999px;margin-top:6px;letter-spacing:.02em;
  }
  .badge.pre{background:#fdf0d5;color:#8a6100;}
  .badge.post{background:#dcecfa;color:#0f5c96;}
  .badge.done{background:#e4ece4;color:#3d6b45;}
  .detail input.note{
    width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin-top:2px;
  }

  /* ---------- sticky footer ---------- */
  .footbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(244,245,247,.97);
    border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);
  }
  .footbar-inner{max-width:640px;margin:0 auto;display:flex;gap:10px;}
  .footbar .btn{margin-top:0;flex:1;}

  /* ---------- job list ---------- */
  .joblist{margin-top:6px;}
  .job{
    display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:11px;padding:14px;margin-bottom:10px;
  }
  .job .jn{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:.02em;}
  .job .jv{font-size:17px;font-weight:600;margin-top:2px;}
  .job .jc{font-size:14px;color:var(--ink-soft);margin-top:1px;}

  /* ---------- summary tiles ---------- */
  .tiles{display:flex;gap:10px;margin:16px 0;}
  .tile{flex:1;border-radius:11px;padding:14px 10px;text-align:center;color:#fff;}
  .tile b{display:block;font-size:30px;font-weight:800;line-height:1;}
  .tile span{font-size:12.5px;font-weight:600;opacity:.92;}
  .tile.g{background:var(--good);} .tile.a{background:var(--avg);} .tile.p{background:var(--poor);}

  .flagline{
    display:flex;gap:9px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;
  }
  .flagline .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;position:relative;top:1px;}
  .flagline .dot.average{background:var(--avg);} .flagline .dot.poor{background:var(--poor);}
  .flagline .cd{font-size:12.5px;font-weight:700;color:var(--ink-soft);}

  .banner{padding:12px 14px;border-radius:10px;font-size:14.5px;margin:12px 0;}
  .banner.err{background:#fdeceb;color:#8f2015;border:1px solid #f3c3bd;}
  .banner.ok{background:#e9f6ed;color:#146b30;border:1px solid #bfe3cb;}

  .loading{text-align:center;padding:48px 0;color:var(--ink-soft);}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div style="flex:1">
      <h1 id="tbTitle">KBC Inspections</h1>
      <div class="sub" id="tbSub"></div>
    </div>
    <button class="iconbtn hidden" id="btnBack">Back</button>
    <button class="iconbtn hidden" id="btnOut">Sign out</button>
  </div>
</div>
<div class="prog hidden" id="prog"><span style="width:0%"></span></div>

<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<div class="footbar hidden" id="footbar"><div class="footbar-inner" id="footbarInner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   KBC Auto Detailing — Pre-Inspection
   ============================================================ */

const SUPABASE_URL = 'https://vlgbwuxuiccfufknibde.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-Mtd5ku4xeTrJx_jaKz5Nw_wAbbsyr0';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app      = document.getElementById('app');
const footbar  = document.getElementById('footbar');
const footIn   = document.getElementById('footbarInner');
const tbTitle  = document.getElementById('tbTitle');
const tbSub    = document.getElementById('tbSub');
const btnBack  = document.getElementById('btnBack');
const btnOut   = document.getElementById('btnOut');
const prog     = document.getElementById('prog');

let ME = null;          // profile row
let ZONES = [];         // all zone_items
let CODES = [];         // defect codes
let JOB = null;         // active job
let INSPECTION = null;  // active inspection row
let SECTIONS = [];      // [{surface, section, optional, items:[]}]
let SIDX = 0;           // current section index
let STATE = {};         // zone_item_id -> {condition, effort, na, codes:[], note}

const EFFORT_DEFAULT = { average:'standard', poor:'extended' };
const EFFORT_LABEL   = { minimal:'Minimal', standard:'Standard', extended:'Extended' };

/* ---------- helpers ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setHeader(title, sub, opts={}){
  tbTitle.textContent = title;
  tbSub.textContent = sub || '';
  btnBack.classList.toggle('hidden', !opts.back);
  btnOut.classList.toggle('hidden', !opts.out);
}
function setFooter(html){
  if(!html){ footbar.classList.add('hidden'); footIn.innerHTML=''; return; }
  footIn.innerHTML = html; footbar.classList.remove('hidden');
}
function setProgress(pct){
  if(pct === null){ prog.classList.add('hidden'); return; }
  prog.classList.remove('hidden');
  prog.firstElementChild.style.width = pct + '%';
}
function banner(msg, kind='err'){
  return `<div class="banner ${kind}">${esc(msg)}</div>`;
}

/* Mobile signal drops mid-request and Safari throws "Load failed" even when
   the write already landed. Retry quietly before ever bothering the tech. */
async function withRetry(fn, tries=3){
  let lastErr;
  for(let i=0;i<tries;i++){
    try{
      const res = await fn();
      if(res && res.error){ lastErr = res.error; }
      else return res;
    } catch(e){ lastErr = e; }
    if(i < tries-1) await new Promise(r=>setTimeout(r, 600*(i+1)));
  }
  return { error: lastErr };
}

/* ============================================================
   AUTH
   ============================================================ */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ return screenLogin(); }
  const { data:profile, error } = await sb
    .from('profiles').select('*').eq('id', session.user.id).single();
  if(error || !profile){
    app.innerHTML = banner('Signed in, but no profile found. Ask the admin to set up your account.');
    setFooter(`<button class="btn ghost" onclick="signOut()">Sign out</button>`);
    return;
  }
  ME = profile;
  await loadReference();
  screenHome();
}

async function loadReference(){
  const [z, c] = await Promise.all([
    sb.from('zone_items').select('*').eq('active', true).order('sort_order'),
    sb.from('defect_codes').select('*').order('sort_order')
  ]);
  ZONES = z.data || [];
  CODES = c.data || [];
  // group into ordered sections
  SECTIONS = [];
  let cur = null;
  for(const item of ZONES){
    if(!cur || cur.section !== item.section || cur.surface !== item.surface){
      cur = { surface:item.surface, section:item.section, optional:item.optional, items:[] };
      SECTIONS.push(cur);
    }
    cur.items.push(item);
  }
}

function screenLogin(){
  setHeader('KBC Inspections','Sign in to continue');
  setProgress(null); setFooter(null);
  app.innerHTML = `
    <div class="card" style="margin-top:24px">
      <h3>Sign in</h3>
      <div id="loginMsg"></div>
      <label class="f"><span>Email</span><input id="email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="f"><span>Password</span><input id="pw" type="password" autocomplete="current-password"></label>
      <button class="btn primary" id="doLogin">Sign in</button>
    </div>`;
  document.getElementById('doLogin').onclick = async (e) => {
    const btn = e.target; btn.disabled = true; btn.textContent = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('pw').value
    });
    if(error){
      document.getElementById('loginMsg').innerHTML = banner(error.message);
      btn.disabled = false; btn.textContent = 'Sign in';
    } else { location.reload(); }
  };
  document.getElementById('pw').addEventListener('keydown', ev=>{
    if(ev.key==='Enter') document.getElementById('doLogin').click();
  });
}

async function signOut(){ await sb.auth.signOut(); location.reload(); }
btnOut.onclick = signOut;

/* ============================================================
   HOME
   ============================================================ */
async function screenHome(){
  setHeader('KBC Inspections', ME.full_name + (ME.role==='admin' ? ' · Admin' : ''), {out:true});
  setProgress(null);
  app.innerHTML = `<div class="loading">Loading jobs…</div>`;
  setFooter(`<button class="btn primary" onclick="screenNewJob()">Start new inspection</button>`);

  const { data:jobs } = await sb.from('jobs')
    .select('id, job_number, customer_name, vehicle, status, created_at')
    .order('created_at', { ascending:false }).limit(25);

  const badge = s =>
    s === 'awaiting_service' ? `<span class="badge post">Post-inspection due</span>`
  : s === 'complete'         ? `<span class="badge done">Complete</span>`
  :                            `<span class="badge pre">Pre-inspection in progress</span>`;

  const card = j => `
    <button class="job" onclick="openJob('${j.id}')">
      <div class="jn">${esc(j.job_number)}</div>
      <div class="jv">${esc(j.vehicle)}</div>
      <div class="jc">${esc(j.customer_name)}</div>
      ${badge(j.status)}
    </button>`;

  const open = (jobs||[]).filter(j => j.status !== 'complete');
  const done = (jobs||[]).filter(j => j.status === 'complete').slice(0,8);

  app.innerHTML = `
    <h2>Open jobs</h2>
    ${ open.length === 0
      ? `<p class="note">No open jobs. Start a new inspection below.</p>`
      : `<div class="joblist">${open.map(card).join('')}</div>` }
    ${ done.length
      ? `<h2>Recent</h2><div class="joblist">${done.map(card).join('')}</div>` : '' }`;
}

async function openJob(id){
  const { data:job } = await sb.from('jobs').select('*').eq('id', id).single();
  if(!job) return;
  JOB = job;
  const { data:insps } = await sb.from('inspections').select('*').eq('job_id', id);
  const pre  = (insps||[]).find(i => i.phase === 'pre');
  const post = (insps||[]).find(i => i.phase === 'post');

  if(!pre){ await startInspection(); return; }
  if(!pre.completed_at){ INSPECTION = pre; await resumeInspection(); return; }
  if(post){ INSPECTION = post; await resumePost(); return; }
  screenPostIntro(pre);
}

/* ============================================================
   NEW JOB
   ============================================================ */
function screenNewJob(){
  setHeader('New inspection','Client and vehicle', {back:true});
  setProgress(null); setFooter(null);
  btnBack.onclick = screenHome;
  app.innerHTML = `
    <div class="card">
      <div id="jobMsg"></div>
      <label class="f"><span>Customer name</span><input id="f_name" autocomplete="off"></label>
      <label class="f"><span>Phone</span><input id="f_phone" type="tel" inputmode="tel" autocomplete="off"></label>
      <label class="f"><span>Vehicle</span><input id="f_vehicle" placeholder="2019 Silver Tahoe" autocomplete="off"></label>
      <label class="f"><span>Plate or VIN</span><input id="f_plate" autocomplete="off"></label>
      <label class="f"><span>Service scope</span>
        <select id="f_package">
          <option value="">Select…</option>
          <option>Exterior only</option>
          <option>Interior only</option>
          <option>Full — interior and exterior</option>
        </select></label>
      <label class="f"><span>Location</span>
        <select id="f_location">
          <option>Mobile — customer site</option>
          <option>Shop</option>
        </select></label>
      <button class="btn primary" id="doCreate">Create job and start</button>
    </div>`;
  document.getElementById('doCreate').onclick = createJob;
}

async function createJob(e){
  const name = document.getElementById('f_name').value.trim();
  const vehicle = document.getElementById('f_vehicle').value.trim();
  if(!name || !vehicle){
    document.getElementById('jobMsg').innerHTML =
      banner('Customer name and vehicle are both required.');
    return;
  }
  const btn = e.target; btn.disabled = true; btn.textContent = 'Creating…';
  const { data, error } = await withRetry(() => sb.from('jobs').insert({
    customer_name: name,
    customer_phone: document.getElementById('f_phone').value.trim() || null,
    vehicle,
    plate_vin: document.getElementById('f_plate').value.trim() || null,
    package: document.getElementById('f_package').value || null,
    location: document.getElementById('f_location').value,
    created_by: ME.id
  }).select().single());

  if(error){
    document.getElementById('jobMsg').innerHTML = banner(error.message);
    btn.disabled = false; btn.textContent = 'Create job and start';
    return;
  }
  JOB = data;
  await startInspection();
}

/* ============================================================
   INSPECTION
   ============================================================ */
async function startInspection(){
  const { data, error } = await withRetry(() => sb.from('inspections').insert({
    job_id: JOB.id, phase:'pre', tech_id: ME.id
  }).select().single());
  if(error){ app.innerHTML = banner('Could not start inspection: ' + error.message); return; }
  INSPECTION = data; STATE = {}; SIDX = 0;
  screenSection();
}

async function resumeInspection(){
  const { data:items } = await sb.from('inspection_items')
    .select('*').eq('inspection_id', INSPECTION.id);
  STATE = {};
  for(const it of (items||[])){
    STATE[it.zone_item_id] = {
      condition: it.condition, effort: it.effort,
      na: it.not_applicable, codes: it.defect_codes || [], note: it.note || ''
    };
  }
  SIDX = 0;
  for(let i=0;i<SECTIONS.length;i++){
    if(SECTIONS[i].items.some(z => !STATE[z.id])){ SIDX = i; break; }
    SIDX = i;
  }
  screenSection();
}

function sectionDoneCount(sec){
  return sec.items.filter(z => STATE[z.id] && (STATE[z.id].condition || STATE[z.id].na)).length;
}
function overallProgress(){
  const done = ZONES.filter(z => STATE[z.id] && (STATE[z.id].condition || STATE[z.id].na)).length;
  return Math.round(done / ZONES.length * 100);
}

function screenSection(){
  const sec = SECTIONS[SIDX];
  setHeader(sec.section, `${JOB.job_number} · ${sec.surface === 'exterior' ? 'Exterior':'Interior'} · Section ${SIDX+1} of ${SECTIONS.length}`, {back:true});
  setProgress(overallProgress());
  btnBack.onclick = () => { if(SIDX>0){ SIDX--; screenSection(); } else screenHome(); };

  app.innerHTML = `
    <div class="sect">
      <span>${esc(sec.section)}</span>
      <span class="cnt" id="secCnt">${sectionDoneCount(sec)} of ${sec.items.length}</span>
    </div>
    <div class="rows" id="rows">
      ${sec.items.map(z => rowHTML(z)).join('')}
    </div>
    ${ sec.optional ? `<button class="btn ghost" onclick="markSectionNA()">Not equipped — skip this section</button>` : '' }
    <button class="btn ghost" onclick="markSectionGood()">Mark all remaining as Good</button>`;

  setFooter(`
    ${ SIDX>0 ? `<button class="btn ghost" onclick="prevSection()">Previous</button>` : '' }
    <button class="btn primary" id="nextBtn" onclick="nextSection()"></button>`);

  bindRows();
  refreshNextBtn();
}

/* Next stays locked until every zone in the section has an answer.
   N/A counts as an answer — that is the escape hatch, not a blank. */
function refreshNextBtn(){
  const btn = document.getElementById('nextBtn');
  if(!btn) return;
  const sec = SECTIONS[SIDX];
  const left = sec.items.length - sectionDoneCount(sec);
  const last = SIDX === SECTIONS.length - 1;
  if(left > 0){
    btn.disabled = true;
    btn.textContent = `${left} left to mark`;
  } else {
    btn.disabled = false;
    btn.textContent = last ? 'Finish inspection' : 'Next section';
  }
}

function rowHTML(z){
  const s = STATE[z.id] || {};
  const showDetail = s.condition === 'average' || s.condition === 'poor';
  return `
  <div class="row ${ (s.condition||s.na) ? 'done':'' }" data-zid="${z.id}">
    <div class="row-main">
      <div class="row-label">${esc(z.item_label)}</div>
      <div class="marks">
        <button class="mark ${s.condition==='good'?'on':''}"    data-v="good"    aria-label="Good">G</button>
        <button class="mark ${s.condition==='average'?'on':''}" data-v="average" aria-label="Average">A</button>
        <button class="mark ${s.condition==='poor'?'on':''}"    data-v="poor"    aria-label="Poor">P</button>
        <button class="mark ${s.na?'on':''}"                    data-v="na"      aria-label="Not applicable">N/A</button>
      </div>
    </div>
    <div class="detail ${showDetail?'':'hidden'}">
      <div class="lbl">What is it?</div>
      <div class="chips codes">
        ${CODES.map(c=>`<button class="chip ${ (s.codes||[]).includes(c.code)?'on':'' }" data-code="${c.code}">${esc(c.code)} ${esc(c.label)}</button>`).join('')}
      </div>
      <div class="lbl">Work needed</div>
      <div class="chips efforts">
        ${['minimal','standard','extended'].map(ef=>`<button class="chip ${s.effort===ef?'on':''}" data-effort="${ef}">${EFFORT_LABEL[ef]}</button>`).join('')}
      </div>
      <input class="note" placeholder="Note (optional)" value="${esc(s.note||'')}">
    </div>
  </div>`;
}

function bindRows(){
  document.querySelectorAll('.row').forEach(row=>{
    const zid = +row.dataset.zid;
    row.querySelectorAll('.mark').forEach(btn=>{
      btn.onclick = () => {
        const v = btn.dataset.v;
        const s = STATE[zid] || { codes:[], note:'' };
        if(v === 'na'){
          s.na = !s.na;
          if(s.na){ s.condition = null; s.effort = null; s.codes = []; }
        } else {
          s.na = false;
          s.condition = (s.condition === v) ? null : v;
          s.effort = s.condition ? (s.effort || EFFORT_DEFAULT[s.condition] || null) : null;
          if(s.condition === 'good' || !s.condition) s.codes = [];
        }
        STATE[zid] = s;
        redrawRow(row, zid);
      };
    });
    wireDetail(row, zid);
  });
}

function wireDetail(row, zid){
  row.querySelectorAll('.codes .chip').forEach(chip=>{
    chip.onclick = () => {
      const s = STATE[zid]; if(!s) return;
      const code = chip.dataset.code;
      s.codes = s.codes || [];
      const i = s.codes.indexOf(code);
      if(i >= 0) s.codes.splice(i,1); else s.codes.push(code);
      chip.classList.toggle('on');
    };
  });
  row.querySelectorAll('.efforts .chip').forEach(chip=>{
    chip.onclick = () => {
      const s = STATE[zid]; if(!s) return;
      s.effort = chip.dataset.effort;
      row.querySelectorAll('.efforts .chip').forEach(c=>c.classList.remove('on'));
      chip.classList.add('on');
    };
  });
  const note = row.querySelector('.note');
  if(note) note.oninput = () => { if(STATE[zid]) STATE[zid].note = note.value; };
}

function redrawRow(row, zid){
  const s = STATE[zid] || {};
  row.querySelectorAll('.mark').forEach(b=>{
    const v = b.dataset.v;
    b.classList.toggle('on', v === 'na' ? !!s.na : s.condition === v);
  });
  row.classList.toggle('done', !!(s.condition || s.na));
  const det = row.querySelector('.detail');
  const show = s.condition === 'average' || s.condition === 'poor';
  det.classList.toggle('hidden', !show);
  if(show){
    det.querySelectorAll('.efforts .chip').forEach(c=>
      c.classList.toggle('on', c.dataset.effort === s.effort));
    det.querySelectorAll('.codes .chip').forEach(c=>
      c.classList.toggle('on', (s.codes||[]).includes(c.dataset.code)));
  }
  document.getElementById('secCnt').textContent =
    `${sectionDoneCount(SECTIONS[SIDX])} of ${SECTIONS[SIDX].items.length}`;
  setProgress(overallProgress());
  refreshNextBtn();
}

function markSectionGood(){
  for(const z of SECTIONS[SIDX].items){
    const s = STATE[z.id];
    if(!s || (!s.condition && !s.na)){
      STATE[z.id] = { condition:'good', effort:null, na:false, codes:[], note:'' };
    }
  }
  screenSection();
}
function markSectionNA(){
  for(const z of SECTIONS[SIDX].items){
    STATE[z.id] = { condition:null, effort:null, na:true, codes:[], note:'' };
  }
  screenSection();
}

async function saveSection(){
  const rows = SECTIONS[SIDX].items
    .filter(z => STATE[z.id] && (STATE[z.id].condition || STATE[z.id].na))
    .map(z => ({
      inspection_id: INSPECTION.id,
      zone_item_id: z.id,
      condition: STATE[z.id].condition || null,
      effort: STATE[z.id].effort || null,
      not_applicable: !!STATE[z.id].na,
      defect_codes: STATE[z.id].codes || [],
      note: STATE[z.id].note || null,
      updated_at: new Date().toISOString()
    }));
  if(!rows.length) return { error:null };
  return await withRetry(() => sb.from('inspection_items')
    .upsert(rows, { onConflict:'inspection_id,zone_item_id' }));
}

async function prevSection(){ await saveSection(); SIDX--; screenSection(); }

async function nextSection(){
  const sec = SECTIONS[SIDX];
  if(sectionDoneCount(sec) < sec.items.length) return;   // guard; button is disabled anyway
  const btn = document.getElementById('nextBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await saveSection();
  if(error){
    alert('Could not save after a few tries — check your signal and tap Next again.\n\n' + error.message);
    refreshNextBtn();
    return;
  }
  if(SIDX === SECTIONS.length - 1){ screenSummary(); }
  else { SIDX++; screenSection(); }
}

/* ============================================================
   SUMMARY
   ============================================================ */
async function screenSummary(){
  setHeader('Inspection summary', JOB.job_number + ' · ' + JOB.vehicle, {back:true});
  setProgress(100);
  btnBack.onclick = () => { SIDX = SECTIONS.length-1; screenSection(); };

  const counts = { good:0, average:0, poor:0, na:0 };
  const flagged = [];
  for(const z of ZONES){
    const s = STATE[z.id]; if(!s) continue;
    if(s.na){ counts.na++; continue; }
    if(s.condition){ counts[s.condition]++; }
    if(s.condition === 'average' || s.condition === 'poor'){
      flagged.push({ z, s });
    }
  }

  app.innerHTML = `
    <div class="tiles">
      <div class="tile g"><b>${counts.good}</b><span>Good</span></div>
      <div class="tile a"><b>${counts.average}</b><span>Average</span></div>
      <div class="tile p"><b>${counts.poor}</b><span>Poor</span></div>
    </div>
    <p class="note">${counts.na} marked not applicable · ${ZONES.length} zones total</p>

    <h2>Flagged for post-inspection</h2>
    ${ flagged.length === 0
      ? `<p class="note">Nothing flagged. The post-inspection will have no carry-forward items.</p>`
      : flagged.map(({z,s})=>`
        <div class="flagline">
          <span class="dot ${s.condition}"></span>
          <span style="flex:1">${esc(z.section)} — ${esc(z.item_label)}
            ${ s.note ? `<br><span class="cd" style="font-weight:500">${esc(s.note)}</span>` : '' }</span>
          <span class="cd">${ (s.codes||[]).join(' ') || '—' }</span>
        </div>`).join('') }

    <div class="card" style="margin-top:20px">
      <h3>Overall notes</h3>
      <input class="note" id="overallNote" placeholder="Anything else worth recording"
             value="${esc(INSPECTION.notes||'')}"
             style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px">
    </div>`;

  setFooter(`<button class="btn primary" id="finBtn" onclick="finishInspection()">Complete pre-inspection</button>`);
}

async function finishInspection(){
  const btn = document.getElementById('finBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const allRows = ZONES
    .filter(z => STATE[z.id] && (STATE[z.id].condition || STATE[z.id].na))
    .map(z => ({
      inspection_id: INSPECTION.id,
      zone_item_id: z.id,
      condition: STATE[z.id].condition || null,
      effort: STATE[z.id].effort || null,
      not_applicable: !!STATE[z.id].na,
      defect_codes: STATE[z.id].codes || [],
      note: STATE[z.id].note || null,
      updated_at: new Date().toISOString()
    }));

  const up = await withRetry(() => sb.from('inspection_items')
    .upsert(allRows, { onConflict:'inspection_id,zone_item_id' }));
  if(up.error){
    alert('Could not save after a few tries — check your signal and tap Complete again.\n\n' + up.error.message);
    btn.disabled=false; btn.textContent='Complete pre-inspection'; return;
  }

  await withRetry(() => sb.from('inspections').update({
    notes: document.getElementById('overallNote').value || null,
    completed_at: new Date().toISOString()
  }).eq('id', INSPECTION.id));

  await withRetry(() => sb.from('jobs').update({
    status:'awaiting_service', updated_at:new Date().toISOString()
  }).eq('id', JOB.id));

  app.innerHTML = `
    ${banner('Pre-inspection saved.','ok')}
    <div class="card">
      <h3>${esc(JOB.job_number)}</h3>
      <p class="note">${esc(JOB.vehicle)} — ${esc(JOB.customer_name)}</p>
      <p class="note">Take the 12 before photos in Fieldd. Damage photos and signature capture
      are coming in the next build — for now, note anything unusual on the job.</p>
    </div>`;
  setFooter(`<button class="btn primary" onclick="screenHome()">Back to jobs</button>`);
  setProgress(null);
}

/* ============================================================
   POST-INSPECTION — carry-forward
   ============================================================ */

let CARRIED = [];   // [{zone, pre:{condition,effort,codes,note}}]
let POST = {};      // zone_item_id -> {outcome, codes:[], note, isNew}

const OUTCOME_LABEL = {
  resolved:'Resolved', still_present:'Still there', new_issue:'New issue'
};

async function screenPostIntro(pre){
  setHeader('Post-inspection', JOB.job_number + ' · ' + JOB.vehicle, {back:true});
  setProgress(null);
  btnBack.onclick = screenHome;

  const { data:flags } = await sb.from('flagged_from_pre')
    .select('*').eq('job_id', JOB.id).order('sort_order');

  const n = (flags||[]).length;
  app.innerHTML = `
    <div class="card">
      <h3>Before you start</h3>
      <p class="note">The pre-inspection flagged <strong>${n}</strong>
        zone${n===1?'':'s'}. You'll only be asked about those — not all
        ${ZONES.length}. Anything you find that wasn't flagged before gets added
        as a new issue.</p>
      <p class="note">Take the 12 after photos in Fieldd before you finish here.</p>
    </div>`;
  setFooter(`<button class="btn primary" id="startPost" onclick="startPost()">Start post-inspection</button>`);
}

async function startPost(){
  const btn = document.getElementById('startPost');
  if(btn){ btn.disabled = true; btn.textContent = 'Starting…'; }
  const { data, error } = await withRetry(() => sb.from('inspections').insert({
    job_id: JOB.id, phase:'post', tech_id: ME.id
  }).select().single());
  if(error){ app.innerHTML = banner('Could not start: ' + error.message); return; }
  INSPECTION = data; POST = {};
  await loadCarried();
  screenPost();
}

async function resumePost(){
  await loadCarried();
  const { data:items } = await sb.from('inspection_items')
    .select('*').eq('inspection_id', INSPECTION.id);
  POST = {};
  for(const it of (items||[])){
    POST[it.zone_item_id] = {
      outcome: it.outcome,
      codes: it.defect_codes || [],
      note: it.note || '',
      isNew: it.outcome === 'new_issue' && !CARRIED.some(c => c.zone.id === it.zone_item_id)
    };
  }
  screenPost();
}

async function loadCarried(){
  const { data:flags } = await sb.from('flagged_from_pre')
    .select('*').eq('job_id', JOB.id).order('sort_order');
  CARRIED = (flags||[]).map(f => ({
    zone: ZONES.find(z => z.id === f.zone_item_id) || {
      id:f.zone_item_id, section:f.section, item_label:f.item_label, surface:f.surface
    },
    pre: { condition:f.pre_condition, effort:f.pre_effort,
           codes:f.pre_defect_codes || [], note:f.pre_note }
  })).filter(c => c.zone);
}

function postAnsweredCount(){
  const carriedDone = CARRIED.filter(c => POST[c.zone.id] && POST[c.zone.id].outcome).length;
  return carriedDone;
}

function screenPost(){
  setHeader('Post-inspection', `${JOB.job_number} · ${postAnsweredCount()} of ${CARRIED.length} checked`, {back:true});
  setProgress(CARRIED.length ? Math.round(postAnsweredCount()/CARRIED.length*100) : 100);
  btnBack.onclick = screenHome;

  const newOnes = Object.entries(POST)
    .filter(([zid, v]) => v.isNew)
    .map(([zid, v]) => ({ zone: ZONES.find(z => z.id === +zid), v }))
    .filter(x => x.zone);

  app.innerHTML = `
    ${ CARRIED.length === 0
      ? `<div class="card"><p class="note">The pre-inspection flagged nothing, so
           there's nothing to re-check. Add any new issues you found below.</p></div>`
      : `<div class="sect"><span>Flagged before service</span>
           <span class="cnt">${postAnsweredCount()} of ${CARRIED.length}</span></div>
         <div class="rows">${CARRIED.map(c => carriedRowHTML(c)).join('')}</div>` }

    <div class="sect" style="margin-top:20px"><span>New issues</span>
      <span class="cnt">${newOnes.length}</span></div>
    <div class="rows">
      ${ newOnes.length === 0
        ? `<div class="row"><p class="note" style="margin:2px 0">Nothing added. If you
             found damage that wasn't flagged before, add it here — the client needs to
             know before handoff.</p></div>`
        : newOnes.map(x => newIssueRowHTML(x.zone, x.v)).join('') }
    </div>
    <button class="btn ghost" onclick="screenAddIssue()">Add a new issue</button>`;

  bindCarriedRows();
  bindNewRows();
  setFooter(`<button class="btn primary" id="postNext" onclick="screenPostSummary()"></button>`);
  refreshPostBtn();
}

function carriedRowHTML(c){
  const s = POST[c.zone.id] || {};
  const showDetail = s.outcome === 'still_present';
  return `
  <div class="row prow ${s.outcome ? 'done':''}" data-zid="${c.zone.id}">
    <div class="row-label" style="margin-bottom:8px">
      ${esc(c.zone.item_label)}
      <div class="cd" style="font-weight:600;margin-top:2px">
        ${esc(c.zone.section)} · was ${esc(c.pre.condition||'')}${ c.pre.codes.length ? ' · ' + esc(c.pre.codes.join(' ')) : '' }
      </div>
      ${ c.pre.note ? `<div class="cd" style="font-weight:500">${esc(c.pre.note)}</div>` : '' }
    </div>
    <div class="chips" style="margin-bottom:0">
      <button class="chip out ${s.outcome==='resolved'?'on ok':''}" data-out="resolved">Resolved</button>
      <button class="chip out ${s.outcome==='still_present'?'on bad':''}" data-out="still_present">Still there</button>
    </div>
    <div class="detail ${showDetail?'':'hidden'}">
      <div class="lbl">What's still there?</div>
      <div class="chips codes">
        ${CODES.map(cd=>`<button class="chip ${ (s.codes||[]).includes(cd.code)?'on':'' }" data-code="${cd.code}">${esc(cd.code)} ${esc(cd.label)}</button>`).join('')}
      </div>
      <input class="note" placeholder="What did you tell the client?" value="${esc(s.note||'')}">
    </div>
  </div>`;
}

function newIssueRowHTML(zone, s){
  return `
  <div class="row nrow done" data-zid="${zone.id}">
    <div class="row-main">
      <div class="row-label">${esc(zone.item_label)}
        <div class="cd" style="font-weight:600;margin-top:2px">${esc(zone.section)}</div>
      </div>
      <button class="mark" data-remove="${zone.id}" aria-label="Remove">✕</button>
    </div>
    <div class="detail">
      <div class="lbl">What is it?</div>
      <div class="chips codes">
        ${CODES.map(cd=>`<button class="chip ${ (s.codes||[]).includes(cd.code)?'on':'' }" data-code="${cd.code}">${esc(cd.code)} ${esc(cd.label)}</button>`).join('')}
      </div>
      <input class="note" placeholder="What did you tell the client?" value="${esc(s.note||'')}">
    </div>
  </div>`;
}

function bindCarriedRows(){
  document.querySelectorAll('.row.prow').forEach(row=>{
    const zid = +row.dataset.zid;
    row.querySelectorAll('.chip.out').forEach(btn=>{
      btn.onclick = () => {
        const s = POST[zid] || { codes:[], note:'', isNew:false };
        const v = btn.dataset.out;
        s.outcome = (s.outcome === v) ? null : v;
        if(s.outcome !== 'still_present') s.codes = [];
        POST[zid] = s;
        redrawCarried(row, zid);
      };
    });
    wirePostDetail(row, zid);
  });
}

function redrawCarried(row, zid){
  const s = POST[zid] || {};
  row.querySelectorAll('.chip.out').forEach(b=>{
    const v = b.dataset.out;
    b.classList.toggle('on', s.outcome === v);
    b.classList.toggle('ok',  s.outcome === v && v === 'resolved');
    b.classList.toggle('bad', s.outcome === v && v === 'still_present');
  });
  row.classList.toggle('done', !!s.outcome);
  const det = row.querySelector('.detail');
  const show = s.outcome === 'still_present';
  det.classList.toggle('hidden', !show);
  if(show){
    det.querySelectorAll('.codes .chip').forEach(c=>
      c.classList.toggle('on', (s.codes||[]).includes(c.dataset.code)));
  }
  setHeader('Post-inspection', `${JOB.job_number} · ${postAnsweredCount()} of ${CARRIED.length} checked`, {back:true});
  setProgress(CARRIED.length ? Math.round(postAnsweredCount()/CARRIED.length*100) : 100);
  refreshPostBtn();
}

function bindNewRows(){
  document.querySelectorAll('.row.nrow').forEach(row=>{
    const zid = +row.dataset.zid;
    const rm = row.querySelector('[data-remove]');
    if(rm) rm.onclick = () => { delete POST[zid]; screenPost(); };
    wirePostDetail(row, zid);
  });
}

function wirePostDetail(row, zid){
  row.querySelectorAll('.codes .chip').forEach(chip=>{
    chip.onclick = () => {
      const s = POST[zid]; if(!s) return;
      s.codes = s.codes || [];
      const i = s.codes.indexOf(chip.dataset.code);
      if(i>=0) s.codes.splice(i,1); else s.codes.push(chip.dataset.code);
      chip.classList.toggle('on');
    };
  });
  const note = row.querySelector('.note');
  if(note) note.oninput = () => { if(POST[zid]) POST[zid].note = note.value; };
}

function refreshPostBtn(){
  const btn = document.getElementById('postNext');
  if(!btn) return;
  const left = CARRIED.length - postAnsweredCount();
  if(left > 0){ btn.disabled = true; btn.textContent = `${left} left to check`; }
  else { btn.disabled = false; btn.textContent = 'Review and finish'; }
}

/* ---------- post summary ---------- */
function screenPostSummary(){
  setHeader('Post-inspection summary', JOB.job_number + ' · ' + JOB.vehicle, {back:true});
  setProgress(100);
  btnBack.onclick = screenPost;

  let resolved=0, still=0;
  const stillList=[], newList=[];
  for(const c of CARRIED){
    const s = POST[c.zone.id]; if(!s) continue;
    if(s.outcome === 'resolved') resolved++;
    if(s.outcome === 'still_present'){ still++; stillList.push({zone:c.zone, s}); }
  }
  for(const [zid, v] of Object.entries(POST)){
    if(v.isNew){ const z = ZONES.find(z=>z.id === +zid); if(z) newList.push({zone:z, s:v}); }
  }

  const mustTell = stillList.length + newList.length;

  app.innerHTML = `
    <div class="tiles">
      <div class="tile g"><b>${resolved}</b><span>Resolved</span></div>
      <div class="tile a"><b>${still}</b><span>Still there</span></div>
      <div class="tile p"><b>${newList.length}</b><span>New</span></div>
    </div>

    ${ mustTell > 0 ? `
      <div class="banner err" style="font-weight:600">
        Tell the client about ${mustTell} item${mustTell===1?'':'s'} before they take the car.
      </div>` : `<div class="banner ok">Everything flagged was resolved. Nothing to raise at handoff.</div>` }

    ${ stillList.length ? `<h2>Still there</h2>` + stillList.map(({zone,s})=>`
        <div class="flagline">
          <span class="dot average"></span>
          <span style="flex:1">${esc(zone.section)} — ${esc(zone.item_label)}
            ${ s.note ? `<br><span class="cd" style="font-weight:500">${esc(s.note)}</span>` : '' }</span>
          <span class="cd">${ (s.codes||[]).join(' ') || '—' }</span>
        </div>`).join('') : '' }

    ${ newList.length ? `<h2>New issues</h2>` + newList.map(({zone,s})=>`
        <div class="flagline">
          <span class="dot poor"></span>
          <span style="flex:1">${esc(zone.section)} — ${esc(zone.item_label)}
            ${ s.note ? `<br><span class="cd" style="font-weight:500">${esc(s.note)}</span>` : '' }</span>
          <span class="cd">${ (s.codes||[]).join(' ') || '—' }</span>
        </div>`).join('') : '' }

    <div class="card" style="margin-top:20px">
      <h3>Handoff notes</h3>
      <input class="note" id="postNote" placeholder="Anything else worth recording"
             value="${esc(INSPECTION.notes||'')}"
             style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px">
    </div>`;

  setFooter(`<button class="btn primary" id="finPost" onclick="finishPost()">Complete post-inspection</button>`);
}

async function finishPost(){
  const btn = document.getElementById('finPost');
  btn.disabled = true; btn.textContent = 'Saving…';

  const rows = Object.entries(POST)
    .filter(([zid, v]) => v.outcome)
    .map(([zid, v]) => ({
      inspection_id: INSPECTION.id,
      zone_item_id: +zid,
      outcome: v.outcome,
      defect_codes: v.codes || [],
      note: v.note || null,
      not_applicable: false,
      updated_at: new Date().toISOString()
    }));

  if(rows.length){
    const up = await withRetry(() => sb.from('inspection_items')
      .upsert(rows, { onConflict:'inspection_id,zone_item_id' }));
    if(up.error){
      alert('Could not save after a few tries — check your signal and tap Complete again.\n\n' + up.error.message);
      btn.disabled=false; btn.textContent='Complete post-inspection'; return;
    }
  }

  await withRetry(() => sb.from('inspections').update({
    notes: document.getElementById('postNote').value || null,
    completed_at: new Date().toISOString()
  }).eq('id', INSPECTION.id));

  await withRetry(() => sb.from('jobs').update({
    status:'complete', updated_at:new Date().toISOString()
  }).eq('id', JOB.id));

  app.innerHTML = `
    ${banner('Post-inspection saved.','ok')}
    <div class="card">
      <h3>${esc(JOB.job_number)}</h3>
      <p class="note">${esc(JOB.vehicle)} — ${esc(JOB.customer_name)}</p>
      <p class="note">Make sure the 12 after photos are in Fieldd. Client signature
        and PDF export are coming in the next build.</p>
    </div>`;
  setFooter(`<button class="btn primary" onclick="screenHome()">Back to jobs</button>`);
  setProgress(null);
}

boot();
</script>
</body>
